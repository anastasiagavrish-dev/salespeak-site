server {
    listen 80 default_server;
    server_name kz.a-gavrish.com;
    root /opt/salespeak/public;
    charset utf-8;

    include /etc/nginx/salespeak-ssl/main*.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /api/ { proxy_pass http://127.0.0.1:8100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; client_max_body_size 64k; }
    location /admin { proxy_pass http://127.0.0.1:8100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /assets/ { expires 7d; }
    location / { return 301 https://a-gavrish.com$request_uri; }
}
