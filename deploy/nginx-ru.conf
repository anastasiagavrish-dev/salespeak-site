# Основной сайт – a-gavrish.com. HTTPS подключается файлами из /etc/nginx/salespeak-ssl/,
# их пишет salespeak-cert после выпуска сертификата, поэтому этот файл можно спокойно обновлять.
server {
    listen 80 default_server;
    server_name a-gavrish.com www.a-gavrish.com;
    root /opt/salespeak/public;
    index index.html;
    charset utf-8;

    include /etc/nginx/salespeak-ssl/main*.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location /api/ { proxy_pass http://127.0.0.1:8100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; client_max_body_size 64k; }
    location /admin { proxy_pass http://127.0.0.1:8100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    location ~ /\. { deny all; }
    location / {
        if ($host = www.a-gavrish.com) { return 301 https://a-gavrish.com$request_uri; }
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}

# Старый домен salespeak.ru – постраничный 301 на новый, чтобы поисковики передали вес.
server {
    listen 80;
    server_name salespeak.ru www.salespeak.ru;

    include /etc/nginx/salespeak-ssl/old*.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://a-gavrish.com$request_uri; }
}
