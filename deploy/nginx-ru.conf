# Основной сайт – a-gavrish.com. HTTPS подключается файлами из /etc/nginx/salespeak-ssl/,
# их пишет salespeak-cert после выпуска сертификата, поэтому этот файл можно спокойно обновлять.
# Старые страницы сайта на Tilda (/pageNNNN.html) – куда они переехали. Страниц курсов здесь нет: они отдают 404 до решения по курсам.
map $uri $salespeak_tilda {
    default "";
    /page56506087.html /;
    /page78263846.html /;
    /page148181243.html /;
    /page57328991.html /cases/;
    /page57328719.html /cases/cosmetic/;
    /page59665185.html /cases/b2b-case/;
    /page57477639.html /about/;
    /page58898415.html /uslugi/skripty/;
    /page60733515.html /uslugi/treningi/;
    /page69674949.html /cases/africa/;
    /page70970525.html /cases/business-travels/;
    /page70982473.html /cases/detskaya-odezhda/;
    /page70984763.html /cases/gynecology/;
    /page71731505.html /cases/events-equipment/;
    /page71732017.html /cases/bigtech/;
    /page71733105.html /cases/kpi-za-3-dnya/;
    /page72114641.html /cases/marketplaces/;
}

server {
    listen 80 default_server;
    server_name a-gavrish.com www.a-gavrish.com;
    root /opt/salespeak/public;
    index index.html;
    charset utf-8;

    include /etc/nginx/salespeak-ssl/main*.conf;
    if ($host = www.a-gavrish.com) { return 301 https://a-gavrish.com$request_uri; }

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location /api/ { proxy_pass http://127.0.0.1:8100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; client_max_body_size 64k; }
    location /admin { proxy_pass http://127.0.0.1:8100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    location ~ /\. { deny all; }
    location = /sitemap.xml { default_type application/xml; types { } charset_types application/xml; try_files $uri =404; }
    location = /robots.txt { default_type text/plain; types { } try_files $uri =404; }
    # Старые адреса услуг
    location ~ ^/script/?$ { return 301 https://a-gavrish.com/uslugi/skripty/; }
    location ~ ^/training/?$ { return 301 https://a-gavrish.com/uslugi/treningi/; }
    # Служебные страницы старого сайта
    location ~ ^/(new|test)/?$ { return 301 https://a-gavrish.com/; }
    location ~ ^/page[0-9]+\.html$ {
        if ($salespeak_tilda) { return 301 https://a-gavrish.com$salespeak_tilda; }
        return 404;
    }
    # Кейсы старого сайта, которые еще не опубликованы, – временно 302 на /cases/.
    # Как только страница кейса появится в public/cases/<адрес>/, она открывается сама, редирект пропадает.
    location ^~ /cases/ { try_files $uri $uri/ @case_soon; }
    location @case_soon {
        if ($uri ~ ^/cases/(africa|business-travels|detskaya-odezhda|gynecology|events-equipment|bigtech|kpi-za-3-dnya|marketplaces)/?$) {
            return 302 https://a-gavrish.com/cases/;
        }
        return 404;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}

# Старый домен salespeak.ru – постраничный 301 на новый, чтобы поисковики передали вес.
server {
    listen 80;
    server_name salespeak.ru www.salespeak.ru;

    include /etc/nginx/salespeak-ssl/old*.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://a-gavrish.com$request_uri; }
}
